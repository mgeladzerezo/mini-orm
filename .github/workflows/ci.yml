name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test (H2 and PostgreSQL through Testcontainers)
        run: ./mvnw -B verify
      - name: Build the example image
        run: docker build -t mini-orm-example .
