services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 3s
      timeout: 3s
      retries: 20

  blog:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/blog
      JDBC_USER: blog
      JDBC_PASSWORD: blog
      PORT: "8204"
    ports:
      - "8204:8204"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8204'"]
      interval: 5s
      timeout: 3s
      retries: 20
